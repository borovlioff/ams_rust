[package]
name = "adaptive-microservice"
version = "0.1.0"
edition = "2021"

[features]
default = ["production"]
production = ["rdkafka/cmake-build"]
development = ["rdkafka/cmake-build"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "json", "uuid"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
rdkafka = { version = "0.36", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
tonic = "0.11"
prost = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
tokio = { version = "1", features = ["full", "test-util"] }
mockall = "0.13"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
future_incompatible = "allow"

